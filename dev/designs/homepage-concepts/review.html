<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="The Silver Edit homepage design for Silver Medical UK.">
  <title>Silver Medical · The Silver Edit</title>
  <!-- FONT LICENSES -->
  <style>
    :root { font-family: system-ui, sans-serif; color: #193b32; background: #edf0eb; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    h1, p { margin: 0; }
    .review-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 26px; background: #f8faf6; border-bottom: 1px solid #d5dfd5; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand img { object-fit: contain; width: 28px; height: 28px; }
    h1 { font-size: 16px; font-weight: 650; }
    .credit { font-size: 13px; color: #496658; }
    main { width: min(1560px, calc(100% - 32px)); margin: 14px auto; }
    .review { border: 1px solid #c7d3c6; border-radius: 6px; overflow: hidden; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px; background: #f8faf5; border-bottom: 1px solid #d5dfd5; }
    .devices { display: flex; gap: 4px; }
    button, .toolbar a { border: 1px solid #c1cfc4; border-radius: 4px; padding: 7px 11px; background: #f8faf5; color: #193b32; font: 600 13px/1.35 system-ui, sans-serif; cursor: pointer; text-decoration: none; }
    button[aria-pressed="true"] { color: #fff; background: #173d30; border-color: #173d30; }
    button:focus-visible, a:focus-visible, iframe:focus-visible { outline: 2px solid #488565; outline-offset: 2px; }
    .board { overflow: hidden; display: grid; justify-items: center; background: #dfe6dc; }
    .board[data-device="mobile"] { padding: 12px 6px; }
    .frame { position: relative; overflow: hidden; background: white; }
    .board[data-device="mobile"] .frame { border-radius: 16px; outline: 2px solid #24463a; }
    iframe { position: absolute; top: 0; left: 0; display: block; border: 0; transform-origin: top left; background: #fff; }
    .note { padding: 9px 1px 0; font-size: 12px; color: #496658; line-height: 1.5; }
    @media (max-width: 520px) {
      .review-header { padding: 12px; }
      main { width: calc(100% - 16px); margin-top: 8px; }
      h1 { font-size: 14px; }
      .credit { font-size: 11px; }
      button, .toolbar a { padding: 7px 8px; font-size: 12px; }
    }
  </style>
</head>
<body>
  <header class="review-header">
    <div class="brand">
      <img src="../../../apps/storefront/public/brand/silver-medical-mark.svg" width="28" height="28" alt="">
      <h1>Silver Medical · The Silver Edit</h1>
    </div>
    <p class="credit">shishirsabbir</p>
  </header>
  <main>
    <section class="review" aria-label="Interactive homepage preview">
      <div class="toolbar">
        <div class="devices" role="group" aria-label="Preview size">
          <button type="button" data-view="desktop" aria-pressed="true">Desktop</button>
          <button type="button" data-view="mobile" aria-pressed="false">Mobile</button>
        </div>
        <a id="open-preview" target="_blank" rel="noopener">Open full preview</a>
      </div>
      <div class="board" data-device="desktop">
        <div class="frame">
          <iframe sandbox="allow-scripts allow-forms" title="The Silver Edit homepage preview"></iframe>
        </div>
      </div>
    </section>
    <p class="note">Scroll inside the preview. Products, photography and prices are illustrative.</p>
  </main>
  <script>
    const storefront = /*STOREFRONT*/;
    const frame = document.querySelector('.frame');
    const board = document.querySelector('.board');
    const iframe = document.querySelector('iframe');
    const devices = document.querySelectorAll('[data-view]');

    function resizePreview() {
      const mobile = board.dataset.device === 'mobile';
      const width = mobile ? 390 : 1440;
      const available = mobile ? board.clientWidth - 12 : board.clientWidth;
      const scale = Math.min(1, available / width);
      const room = Math.max(520, innerHeight - board.getBoundingClientRect().top - 44);
      const height = mobile ? 844 : Math.max(700, Math.round(room / scale));
      iframe.style.width = width + 'px';
      iframe.style.height = height + 'px';
      iframe.style.transform = 'scale(' + scale + ')';
      frame.style.width = (width * scale) + 'px';
      frame.style.height = (height * scale) + 'px';
    }

    function setDevice(device) {
      board.dataset.device = device;
      for (const button of devices) {
        button.setAttribute('aria-pressed', String(button.dataset.view === device));
      }
      resizePreview();
    }

    for (const button of devices) {
      button.addEventListener('click', () => setDevice(button.dataset.view));
    }

    iframe.srcdoc = storefront;
    const fullPreview = new Blob([storefront], { type: 'text/html;charset=utf-8' });
    document.getElementById('open-preview').href = URL.createObjectURL(fullPreview);

    setDevice(matchMedia('(max-width: 730px)').matches ? 'mobile' : 'desktop');
    new ResizeObserver(resizePreview).observe(board);
    window.addEventListener('resize', resizePreview);
  </script>
</body>
</html>
