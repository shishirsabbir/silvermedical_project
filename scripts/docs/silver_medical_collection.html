<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Silver Medical · Identity collection by shishirsabbir</title>
<style>
*{box-sizing:border-box}html{scroll-padding-top:20px}body{margin:0;background:#f7f7f2;color:#1e302e;font:16px/1.5 "Segoe UI",Arial,sans-serif}button,textarea{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid #528b78;outline-offset:3px}header,footer,.wrap{max-width:1560px;margin:auto;padding-inline:5vw}header,footer,nav,.bar,.sectionhead,.controls,.caption,.modalnav,.reviewactions{display:flex;align-items:center;justify-content:space-between;gap:16px}header{height:68px;border-bottom:1px solid #cad2c9}header strong,footer strong{letter-spacing:-.8px;font-size:19px}nav,.bar,footer,.controls,button,dialog small{font-size:13px}nav a:hover{text-decoration:underline}.hero{padding:44px 0 34px}.hero p{margin:0 0 12px;color:#47615b;font-size:12px;letter-spacing:.13em;text-transform:uppercase}h1,h2,h3{margin:0;font-weight:500;letter-spacing:-.04em}h1{font-size:clamp(46px,6.5vw,96px);line-height:1.05}h1 em{font-family:Georgia,serif;font-weight:400;color:#4b6b61}.hero-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;margin-top:30px}.hero-grid a{display:block;background:white}.hero-grid img,.art img{display:block;width:100%;height:auto}.hero-grid span{padding:11px 15px;display:flex;justify-content:space-between;font-size:13px}.bar{padding:19px 0;border-block:1px solid #c8d1c9;flex-wrap:wrap}.controls{justify-content:flex-start;flex-wrap:wrap;gap:8px}.controls button,.plain,.cta,dialog a{border:1px solid #b9c6bd;border-radius:30px;background:transparent;color:inherit;padding:8px 15px}.controls button[aria-pressed=true],.cta{background:#243e37;color:white}.family{margin:42px 0}.sectionhead{margin-bottom:17px;align-items:baseline}.sectionhead span,.caption small,footer{color:#51645e}.sectionhead span{font-size:12px}h2{font:400 clamp(30px,3.1vw,52px)/1.2 Georgia,serif;letter-spacing:-.04em}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{background:#fff;padding-bottom:20px;border:1px solid #dbe0d9}.art{display:block;border:0;padding:0;width:100%;cursor:zoom-in}.caption{padding:15px 20px 0;justify-content:flex-start;gap:12px}.caption small,dialog small{font-family:Consolas,monospace;letter-spacing:.08em}.caption h3{font-size:22px}.star{margin-left:auto;font-size:23px;background:none;border:0;padding:0 5px;color:#38584d}.card p{margin:6px 20px 0;font-size:14px;color:#4e605a;max-width:58ch}.mono .art,.mono #large{filter:grayscale(1)}[hidden]{display:none!important}.review{background:#e1e9df;margin:45px 0;padding:30px;display:grid;grid-template-columns:1fr 1fr;gap:35px}.review p{font-size:14px}.review label{display:block;font-size:13px;margin-bottom:8px}textarea{width:100%;min-height:95px;padding:12px;border:1px solid #a7baad;border-radius:3px}.reviewactions{margin-top:10px;justify-content:flex-end}.empty{padding:32px 0}footer{padding-block:17px;border-top:1px solid #c8d1c9;flex-wrap:wrap}dialog{padding:0;border:none;width:min(1000px,94vw);max-height:94vh;color:#1e302e;background:#f7f7f2}dialog::backdrop{background:#10251fdb}.modalnav,.modalcopy{padding:15px 22px}#large{display:block;width:100%;max-height:55vh;object-fit:contain}.modalcopy h2{font-size:31px}.modalcopy p{margin:8px 0}.modalnav a{font-size:13px}.modalnav .controls{justify-content:flex-end}
@media(max-width:750px){header,.wrap,footer{padding-inline:16px}header{height:58px}.hero{padding:29px 0 22px}.hero-grid{gap:3px}.hero-grid span{font-size:11px;padding:7px}.hero-grid span b{display:none}.grid,.review{grid-template-columns:1fr}.grid{gap:15px}.family{margin:27px 0}.bar{align-items:flex-start}.controls button{padding:7px 10px}.review{padding:20px;gap:10px}header nav a{display:none}.modalnav{gap:8px;flex-wrap:wrap}.modalnav,.modalcopy{padding:10px 14px}}
@media print{@page{size:A4;margin:12mm}body{background:white}.wrap,header,footer{padding:0}header{height:auto}nav,.bar,.review,.star,dialog,.empty,.hero-grid,footer{display:none!important}.hero{padding:14px 0}h1{font-size:32px}.family,.card{break-inside:auto}.family{margin:12px 0}.sectionhead{break-after:avoid}.card{break-inside:avoid}.grid{display:block}.card{display:inline-block;vertical-align:top;width:48%;margin:0 1% 10px 0;padding-bottom:8px}.caption{padding:6px 8px 0}.caption h3{font-size:15px}.card p{font-size:10px;margin:4px 8px}.sectionhead h2{font-size:24px}*{print-color-adjust:exact}}
</style></head><body><header><strong>shishirsabbir.</strong><nav><a href="#review">Review notes</a><button class="plain" id="print">Print / Save PDF</button></nav></header>
<main class="wrap"><div class="hero"><p>Silver Medical · Identity study 02</p><h1>Silver Medical <em>logo collection</em></h1><div class="hero-grid"><!--HERO--></div></div>
<div class="bar"><div class="controls" aria-label="Filter collection"><button data-filter="all" aria-pressed="true">All 30</button><button data-filter="0" aria-pressed="false">Wordmarks</button><button data-filter="1" aria-pressed="false">Instruments</button><button data-filter="2" aria-pressed="false">Supply</button><button data-filter="saved" aria-pressed="false">Shortlist (<span id="count">0</span>)</button></div><button class="plain" id="mono" aria-pressed="false">Greyscale</button></div>
<!--FAMILIES--><p id="empty" class="empty" hidden>Select a star beside a logo to add it to your shortlist.</p>
<section id="review" class="review"><div><h2>Review notes</h2><p id="selection" aria-live="polite"></p></div><div><label for="notes">What would you keep or refine?</label><textarea id="notes"></textarea><div class="reviewactions"><button class="cta" id="download">Download feedback ↓</button></div></div></section></main>
<footer><strong>shishirsabbir.</strong><span>Silver Medical · silvermedical.co.uk</span></footer>
<dialog id="viewer" aria-labelledby="title"><div class="modalnav"><small id="code"></small><button id="close" class="plain">Close ×</button></div><img id="large" alt=""><div class="modalcopy"><h2 id="title"></h2><p id="note"></p></div><div class="modalnav"><a id="svgfile" download>Download logo SVG ↓</a><div class="controls"><button id="previous">← Previous</button><button id="next">Next →</button></div></div></dialog>
<script>
const byId = id => document.getElementById(id);
const cards = [...document.querySelectorAll('.card')];
const families = [...document.querySelectorAll('.family')];
const storageKey = 'silver-medical-identity-study-02';
let saved = new Set();
let activeFilter = 'all';
let current = 0;
let sequence = [];
try {
  const state = JSON.parse(localStorage.getItem(storageKey) || '{}');
  saved = new Set((state.saved || []).filter(code => cards.some(card => card.dataset.code === code)));
  byId('notes').value = state.notes || '';
} catch {}
function persist() {
  try { localStorage.setItem(storageKey, JSON.stringify({saved:[...saved], notes:byId('notes').value})); } catch {}
}
function refresh() {
  cards.forEach((card,index) => {
    const chosen = saved.has(card.dataset.code);
    const button = card.querySelector('[data-save]');
    button.textContent = chosen ? '★' : '☆';
    button.setAttribute('aria-pressed',String(chosen));
    card.hidden = activeFilter === 'saved' ? !chosen : activeFilter !== 'all' && Number(activeFilter) !== Math.floor(index / 10);
  });
  families.forEach(family => {
    family.hidden = !family.querySelector('.card:not([hidden])');
    const visible = family.querySelectorAll('.card:not([hidden])').length;
    family.querySelector('.sectionhead span').textContent = visible + (visible === 1 ? ' concept' : ' concepts');
  });
  document.querySelectorAll('[data-filter]').forEach(button => button.setAttribute('aria-pressed',String(button.dataset.filter === activeFilter)));
  byId('count').textContent = saved.size;
  byId('selection').textContent = saved.size ? [...saved].sort().map(code => code + ' · ' + cards.find(card=>card.dataset.code===code).dataset.name).join(' / ') : 'Star your favourites to include them with your feedback.';
  byId('empty').hidden = activeFilter !== 'saved' || saved.size > 0;
}
function enlarge(index) {
  current = index;
  const card = cards[index];
  byId('large').src = card.querySelector('img').src;
  byId('large').alt = card.querySelector('img').alt;
  byId('title').textContent = card.dataset.name;
  byId('code').textContent = card.dataset.code + ' / ' + families[Math.floor(index / 10)].querySelector('h2').textContent;
  byId('note').textContent = card.querySelector('p').textContent;
  byId('svgfile').href = byId('large').src;
  byId('svgfile').download = 'Silver-Medical-' + card.dataset.code + '.svg';
  if (!byId('viewer').open) byId('viewer').showModal();
}
function step(amount) {
  const offset = sequence.indexOf(current) + amount + sequence.length;
  enlarge(sequence[offset % sequence.length]);
}
cards.forEach((card,index) => {
  card.querySelector('[data-enlarge]').onclick = () => {
    sequence = cards.map((_,i)=>i).filter(i=>!cards[i].hidden);
    enlarge(index);
  };
  card.querySelector('[data-save]').onclick = () => {
    const code = card.dataset.code;
    if (saved.has(code)) saved.delete(code); else saved.add(code);
    refresh();
    persist();
  };
});
document.querySelectorAll('[data-filter]').forEach(button => button.onclick = () => { activeFilter = button.dataset.filter; refresh(); });
document.querySelectorAll('.hero-grid a').forEach(link => link.onclick = () => { activeFilter='all'; refresh(); });
byId('close').onclick = () => byId('viewer').close();
byId('previous').onclick = () => step(-1);
byId('next').onclick = () => step(1);
byId('viewer').onkeydown = event => {
  if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') { event.preventDefault(); step(event.key === 'ArrowRight' ? 1 : -1); }
};
byId('notes').oninput = persist;
byId('mono').onclick = () => byId('mono').setAttribute('aria-pressed',String(document.body.classList.toggle('mono')));
byId('print').onclick = () => window.print();
byId('download').onclick = () => {
  const lines = ['Silver Medical · Identity review','shishirsabbir · silvermedical.co.uk','',...cards.filter(card=>saved.has(card.dataset.code)).map(card=>card.dataset.code+' '+card.dataset.name),'',byId('notes').value];
  const url = URL.createObjectURL(new Blob([lines.join('\n')],{type:'text/plain;charset=utf-8'}));
  const link = document.createElement('a');
  link.href=url; link.download='Silver-Medical-review.txt'; link.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
};
refresh();
</script></body></html>
